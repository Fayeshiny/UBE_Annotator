[project]
name = "ssi-annotator"
version = "0.1.0"
description = "UBE 外科空间智能（SSI）时序视频标注平台（Protocol v1.0）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
ssi-annotator = "ssi_annotator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ssi_annotator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
